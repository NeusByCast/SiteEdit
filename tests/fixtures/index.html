<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SiteEdit test page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; color: rgb(20, 20, 20); background: #fff; }
    .card { border: 1px solid #ccc; padding: 10px; margin: 8px 0; }
    .item { padding: 4px; }
  </style>
</head>
<body class="page">
  <header class="site">Site header</header>
  <h1 id="title">Hello SiteEdit</h1>
  <p class="intro">Intro paragraph</p>
  <div class="card"><span class="label">First card</span><button id="btn" onclick="window.__clicked = (window.__clicked||0)+1">Click me</button></div>
  <div class="card"><span class="label">Second card</span></div>
  <aside class="learn"><header>Learn header</header><p>Learn body</p></aside>
  <section class="rows">
    <div class="kOSbdU topRow__-dqkhM"><b class="Header_title__a1b2c">Row A</b></div>
    <div class="kOSbdU topRow__-dqkhM"><b class="Header_title__a1b2c">Row B</b></div>
  </section>
  <section class="feed"></section>
  <ul id="list"></ul>
  <div id="slot"></div>
  <script>
    // Deeply nested, repeated cards (like news feeds): 4 identical cards, 15 levels deep.
    (function () {
      const feed = document.querySelector('.feed');
      for (let c = 1; c <= 4; c++) {
        let node = document.createElement('div'); node.className = 'promo GrFgy'; feed.append(node);
        for (let d = 0; d < 14; d++) { const n = document.createElement('div'); n.className = d % 2 ? 'wrap ldvJot' : 'inner'; node.append(n); node = n; }
        const h = document.createElement('h3'); h.className = 'headline'; h.textContent = 'Headline ' + c; node.append(h);
      }
    })();
    // Dynamic content: list items rendered after load, and a late banner.
    setTimeout(() => {
      const list = document.getElementById('list');
      for (let i = 1; i <= 3; i++) { const li = document.createElement('li'); li.className = 'item'; li.textContent = 'Item ' + i; list.append(li); }
    }, 200);
    setTimeout(() => {
      const b = document.createElement('div'); b.id = 'late-banner'; b.textContent = 'Late banner'; document.getElementById('slot').append(b);
    }, 700);
    // Simulate a framework that resets adopted stylesheets after hydration.
    setTimeout(() => { document.adoptedStyleSheets = []; document.body.append(document.createElement('i')); }, 900);
  </script>
</body>
</html>
